server:
  port: 8080
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  data:
    redis:
      host: redis-19189.c252.ap-southeast-1-1.ec2.cloud.redislabs.com
      port: 19189
      username: default
      password: vcICgjUKkNQmB6L8KNgYPhNzozUtDNv8
    web:
      pageable:
        one-indexed-parameters: true

  flyway:
    enabled: true
    locations: classpath:db/migration
  
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          ssl:
            enable: false
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  
  rabbitmq:
    host: chameleon.lmq.cloudamqp.com
    port: 5672
    username: abkqvbjm
    password: 4vwaChdSYTuiz6cPNzyy2FPZ041TVpOX
    virtual-host: abkqvbjm
    listener:
      direct:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 10000ms
        

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    persist-authorization: true
    tags-sorter: alpha

firebase:
  service-account-path: "classpath:firebase-service-account.json"

admin:
  creation:
    enabled: true
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    username: "admin"

aws:
  s3:
    region: ${AWS_REGION}
    bucket-name: ${AWS_S3_BUCKET_NAME}
    access-key-id: ${AWS_ACCESS_KEY_ID}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY}

rabbitmq:
  queue:
    cv-processing: cv_processing_queue
    cv-result: cv_result_queue
  exchange:
    internal: internal_exchange
  routing-key:
    cv-upload: cv_upload_key
    cv_result: cv_result_key
